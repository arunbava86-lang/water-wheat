# Builds the Android APK on GitHub's servers (they have the Android SDK).
# Push this folder to a GitHub repository, open the "Actions" tab, and download
# the "wheat-water-apk" artifact from the finished run.
name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wheat-water-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

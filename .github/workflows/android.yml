# Builds the Android APK on GitHub's servers. Their Ubuntu runners already
# have the Android SDK installed, so no separate Android setup step is needed.
name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Push notifications included?
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found: the APK will receive notifications."
          else
            echo "::warning::android/app/google-services.json is missing. The APK builds and works, but without notifications. Add the file from the Firebase console (see README, Notifications)."
          fi
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wheat-water-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
